[project]
name = "grserve-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anyio==4.15.1",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "protobuf==6.30.2",
  "uvicorn==0.34.2",
]

[project.scripts]
grserve-api = "grserve_api.main:main"

[dependency-groups]
dev = [
  "cmake==4.0.2",
  "mypy==1.15.0",
  "ninja==1.13.2",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.8",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/python"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/grserve_api"]
