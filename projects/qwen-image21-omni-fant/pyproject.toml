[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-image21-omni-fant"
version = "0.1.0"
description = "Minimal vLLM-Omni execution and parallel adapters for Qwen-Image-2.1 on FANT"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

